<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes App - Error</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
    height: 100vh;
    background: #f4f6fb;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    max-width: 420px;
    padding: 20px;
}

.cat {
    width: 260px;
    height: auto;
    border-radius: 18px;
    margin-bottom: 25px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
}

h1 {
    font-size: 22px;
    color: #5a3ef0;
}

p {
    margin-top: 12px;
    color: #555;
    font-size: 15px;
    line-height: 1.5;
}

.btn {
    margin-top: 30px;
    padding: 12px 28px;
    background: black;
    color: white;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.25s;
}

.btn:hover {
    background: #5a3ef0;
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="container">

    <img id="catImage"
         class="cat"
         src="https://media.tenor.com/1W-HKNvj8UoAAAAM/cat.gif"
         alt="Meme Cat">

    <h1 id="title">Hmm... Notes aren’t loading</h1>

    <p id="desc">
        Maybe your internet is thinking about life.
        Try again?
    </p>

    <button class="btn" onclick="retry()">Refresh</button>

</div>

<script>
let retryCount = 0;

function retry() {
    retryCount++;

    if (retryCount === 1) {
        // Switch to crying cat meme
        document.getElementById("catImage").src =
            "https://cdn-useast1.kapwing.com/static/templates/crying-cat-meme-template-full-719a53dc.webp";

        document.getElementById("title").innerText =
            "Still not working 😿";

        document.getElementById("desc").innerText =
            "Okay now this is getting embarrassing. Check your network.";
    } else {
        // Optional: Actually reload after 2nd click
        location.reload();
    }
}
</script>

</body>
</html>
